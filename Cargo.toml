[package]
name = "cardano-tx-lite"
version = "0.1.0"
edition = "2021"
description = "Simplified Cardano (Conway-era) transaction types with web-friendly JSON serde."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
